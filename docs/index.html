<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Портфолио</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e0d;
      --fg: #e9ece6;
      --muted: #9aa39a;
      --line: #2a312c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      min-height: 100svh;
      font-family: "Source Sans 3", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, #1a2a18, transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 10%, #152030, transparent 50%),
        var(--bg);
      color: var(--fg);
      padding: max(32px, env(safe-area-inset-top)) clamp(16px, 4vw, 24px) max(64px, env(safe-area-inset-bottom));
      overflow-x: clip;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 7vw, 3.3rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: clamp(28px, 6vw, 40px);
    }
    .grid { display: grid; gap: 18px; }
    @media (min-width: 560px) and (max-width: 899px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    a.card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #121614;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    a.card:hover { transform: translateY(-4px); border-color: #4a564c; }
    .preview {
      aspect-ratio: 4/3;
      display: grid;
      place-items: end start;
      padding: 16px;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
    }
    .p1 { background: linear-gradient(145deg, #07140f, #1a4d3a 50%, #c6a35a 150%); color: #f2ebe0; }
    .p2 { background: linear-gradient(160deg, #f3f1ea, #ebe7dc 40%, #ff4d1a 130%); color: #101114; }
    .p3 { background: linear-gradient(150deg, #f7fbfc, #d7e8e4 45%, #3f7f78 140%); color: #13202b; }
    .meta { padding: 16px; border-top: 1px solid var(--line); }
    .meta strong { display: block; font-family: Syne, sans-serif; }
    .meta span { display: block; margin-top: 6px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Портфолио</h1>
    <div class="grid">
      <a class="card" href="01-more-studio/">
        <div class="preview p1">MORÉ</div>
        <div class="meta">
          <strong>Студия красоты</strong>
          <span>тёмный люкс</span>
        </div>
      </a>
      <a class="card" href="02-domlinia/">
        <div class="preview p2">ДОМ/ЛИНИЯ</div>
        <div class="meta">
          <strong>Ремонт квартир</strong>
          <span>светлый брутал</span>
        </div>
      </a>
      <a class="card" href="03-kayuta/">
        <div class="preview p3">Каюта</div>
        <div class="meta">
          <strong>Ресторан</strong>
          <span>мягкий свет</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
